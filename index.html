function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function fmt(s){var a=s.split('-');return a[2]+'/'+a[1]+'/'+a[0]}
function doneKey(){return 'hli-done-'+cur.id}
function loadDone(){try{return JSON.parse(localStorage.getItem(doneKey())||'{}')}catch(e){return{}}}
function saveDone(o){try{localStorage.setItem(doneKey(),JSON.stringify(o))}catch(e){}}
function status(t,done){
  if(done||t.done) return {k:'done',cls:'s-ok',pill:'p-ok',label:'Đã xong',rank:9};
  if(!t.due) return {k:'open',cls:'s-idle',pill:'p-idle',label:'Chưa có hạn cụ thể',rank:5};
  var d=Math.round((pd(t.due)-today())/MS);
  if(d<0) return {k:'late',cls:'s-bad',pill:'p-bad',label:'Quá hạn '+(-d)+' ngày',rank:0-(-d)/100};
  if(d===0) return {k:'soon',cls:'s-warn',pill:'p-warn',label:'Đến hạn hôm nay',rank:1};
  if(d<=2) return {k:'soon',cls:'s-warn',pill:'p-warn',label:'Còn '+d+' ngày',rank:2+d/10};
  return {k:'open',cls:'s-ok',pill:'p-ok',label:'Còn '+d+' ngày',rank:3+d/100};
}
function segs(s){return s.map(function(x){return x[1]?'<b>'+esc(x[0])+'</b>':esc(x[0])}).join('')}
function plain(s){return s.map(function(x){return x[0]}).join('')}

function renderMeta(){
  var m=cur; if(!m){$('meta').textContent='Chưa có biên bản.';return}
  $('meta').innerHTML='<span>Ngày <b>'+fmt(m.date)+'</b></span><span>Giờ <b>'+esc(m.time)+'</b></span><span>Địa điểm <b>'+esc(m.place)+'</b></span><span>Số <b>'+esc(m.code)+'</b></span><span>Dự họp <b>'+m.attendees.length+' người</b></span>';
}
function renderEdit(){
  var m=cur,h='';
  if(!m){$('edit').hidden=true;return}
  var locked=m.locked, left='';
  if(m.editUntil){
    var ms=new Date(m.editUntil)-new Date();
    if(ms<=0) locked=true;
    else{var hrs=Math.floor(ms/3600000);left=hrs>=48?'Còn '+Math.floor(hrs/24)+' ngày để chỉnh sửa':'Còn '+hrs+' giờ để chỉnh sửa'}
  }
  var pill=locked?'<span class="pill p-idle">Đã khóa</span>':(m.gdocUrl?'<span class="pill p-ok">Đang mở chỉnh sửa</span>':'<span class="pill p-idle">Chưa gắn Google Doc</span>');
  var msg=locked?'Hết thời hạn chỉnh sửa. Chỉ người quản lý được sửa biên bản này.':(m.gdocUrl?(left||'Thời hạn chỉnh sửa chưa được đặt.'):'Khi gắn link Google Doc, mọi người có thể mở và chỉnh sửa tại đây trong thời hạn do Pháp chế đặt.');
  h='<p><b>Chỉnh sửa biên bản</b> '+pill+'<br>'+esc(msg)+(m.editUntil?' Hạn: '+esc(new Date(m.editUntil).toLocaleString('vi-VN')):'')+'</p>';
  if(m.gdocUrl&&!locked) h+='<a class="btn pri" target="_blank" rel="noopener" href="'+esc(m.gdocUrl)+'">Mở Google Doc</a>';
  $('edit').innerHTML=h;
}
function renderSum(list){
  var d=loadDone(),c={late:0,soon:0,open:0,done:0};
  cur.tasks.forEach(function(t){var s=status(t,d[t.id]);c[s.k]++});
  var cards=[['late','bad','Quá hạn'],['soon','warn','Đến hạn trong 2 ngày'],['open','','Đang theo dõi'],['done','ok','Đã xong']];
  $('sum').innerHTML=cards.map(function(x){return '<button class="c '+x[1]+'" data-f="'+x[0]+'" aria-pressed="'+(fStatus===x[0])+'"><span class="n">'+c[x[0]]+'</span><span class="t">'+x[2]+'</span></button>'}).join('');
  Array.prototype.forEach.call($('sum').querySelectorAll('.c'),function(b){b.onclick=function(){fStatus=(fStatus===b.dataset.f)?'all':b.dataset.f;tab='viec';sync();render()}});
}
function owners(){var o={};cur.tasks.forEach(function(t){t.owner.split(/[,(]/)[0].split(/\s*,\s*/).forEach(function(x){x=x.trim();if(x)o[x]=1})});return Object.keys(o)}
function renderTasks(){
  var d=loadDone(),own=owners();
  var f='<div class="filters"><span class="flabel">Phụ trách</span><button class="chip" data-o="all" aria-pressed="'+(fOwner==='all')+'">Tất cả</button>'+own.map(function(o){return '<button class="chip" data-o="'+esc(o)+'" aria-pressed="'+(fOwner===o)+'">'+esc(o)+'</button>'}).join('')+'</div>';
  var rows=cur.tasks.map(function(t){return {t:t,s:status(t,d[t.id])}}).filter(function(r){
    if(fStatus!=='all'&&r.s.k!==fStatus) return false;
    if(fOwner!=='all'&&r.t.owner.indexOf(fOwner)<0) return false;
    return true}).sort(function(a,b){return a.s.rank-b.s.rank||a.t.id-b.t.id});
  var h=rows.length?'<ul class="tasks">'+rows.map(function(r){var t=r.t,s=r.s,dn=s.k==='done';
    return '<li class="task '+s.cls+(dn?' done':'')+'"><input type="checkbox" id="k'+t.id+'" data-id="'+t.id+'"'+(dn?' checked':'')+' aria-label="Đã xong việc '+t.id+'"><label for="k'+t.id+'" class="tx">'+esc(t.text)+'</label><div class="due"><span class="pill '+s.pill+'">'+s.label+'</span><span>'+(t.due?fmt(t.due):'')+(t.dueText&&/[A-Za-zÀ-ỹ]/.test(t.dueText.replace(/\d+\/\d+/g,'').replace(/\(chiều\)/,''))?(t.due?' · ':'')+esc(t.dueText.replace(/^\d+\/\d+;?\s*/,'')):'')+'</span></div><div class="sub"><span>Phụ trách <b>'+esc(t.owner)+'</b></span><span>Việc '+t.id+'</span></div></li>'}).join('')+'</ul>':'<div class="empty">Không có việc nào khớp bộ lọc.</div>';
  $('main').innerHTML=f+h;
  Array.prototype.forEach.call($('main').querySelectorAll('.chip'),function(b){b.onclick=function(){fOwner=b.dataset.o;render()}});
  Array.prototype.forEach.call($('main').querySelectorAll('.task input'),function(i){i.onchange=function(){var o=loadDone();o[i.dataset.id]=i.checked;saveDone(o);render()}});
}
function blocks(items){
  var h='',open=0;
  function closeTo(l){while(open>l){h+='</ul>';open--}}
  items.forEach(function(p){
    if(p.k==='b'){var l=p.l+1;while(open<l){h+='<ul>';open++}closeTo(l);h+='<li>'+segs(p.s)+'</li>'}
    else{closeTo(0);
      if(p.k==='h') h+='<p class="hh">'+segs(p.s)+'</p>';
      else if(p.k==='c') h+='<p class="concl">➔ '+segs(p.s)+'</p>';
      else h+='<p>'+segs(p.s)+'</p>'}
  });
  closeTo(0);return h;
}

  h+='<h3>1. Thành phần tham dự</h3><div class="tw"><table><thead><tr><th>STT</th><th>Thành phần tham dự</th><th>Công ty / Chức vụ</th><th class="sigcol">Ký tên</th></tr></thead><tbody>'+m.attendees.map(function(a,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(a.name)+'</td><td>'+esc(a.role)+'</td><td style="height:34px"></td></tr>'}).join('')+'</tbody></table></div>';
  h+='<h3>2. Nội dung cuộc họp</h3>'+m.principles.map(function(s){return '<p class="rule">'+segs(s)+'</p>'}).join('');
  h+=m.depts.map(function(d,i){return '<details class="dept"'+(i===0?' open':'')+'><summary><span>'+esc(deptName(d.name))+'</span></summary><div class="dbody"><div class="blk"><h4>Báo cáo và kế hoạch</h4>'+blocks(d.content)+'</div><div class="blk"><h4>Ý kiến và kết luận</h4>'+blocks(d.notes)+'</div></div></details>'}).join('');
  h+='<h3>3. Tổng hợp TGĐ giao việc và chỉ đạo</h3><div class="blk">'+blocks(m.general)+'</div>';
  h+='<div class="tw"><table><thead><tr><th>#</th><th>Nội dung công việc</th><th>Phụ trách</th><th>Thời hạn</th></tr></thead><tbody>'+m.tasks.map(function(t){return '<tr><td>'+t.id+'</td><td>'+esc(t.text)+'</td><td>'+esc(t.owner)+'</td><td>'+esc(t.dueText)+'</td></tr>'}).join('')+'</tbody></table></div>'+signHTML(m)+'</article>';
  return h;
}
function signHTML(m){
  var sg=m.signers&&m.signers.length?m.signers:[{role:'Thư ký lập biên bản',name:'Vũ Quang Phát',title:'Pháp chế kiêm Trợ lý TGĐ'},{role:'Chủ trì cuộc họp',name:'Trần Trọng Dũng',title:'Tổng giám đốc'}];
  var d=pd(m.date);
  return '<p style="text-align:right;margin:6px 0 0;font-style:italic">Ngày '+d.getDate()+' tháng '+(d.getMonth()+1)+' năm '+d.getFullYear()+'</p><table class="sign"><tr>'+sg.map(function(x){return '<td><div class="r">'+esc(x.role)+'</div><div class="h">(Ký, ghi rõ họ tên)</div><div class="sp"></div><div class="nm">'+esc(x.name)+'</div><div class="tl">'+esc(x.title)+'</div></td>'}).join('')+'</tr></table>';
}
function render(){
  if(!cur){$('main').innerHTML='<div class="empty">Chưa có biên bản nào.</div>';return}
  renderSum();
  if(tab==='viec') renderTasks(); else $('main').innerHTML=docHTML(cur);
}
function sync(){
  $('t-viec').setAttribute('aria-selected',tab==='viec');$('t-bb').setAttribute('aria-selected',tab==='bb');
}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2600)}
function save(name,type,content){
  try{var b=new Blob([content],{type:type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000);toast('Đã tạo file '+name)}catch(e){toast('Không tạo được file ở chế độ xem này')}
}
function wordHTML(m){
  var css='<style>body{font-family:"Times New Roman";font-size:12pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:4px 6px;vertical-align:top}th{background:#dae9f7}h2{text-align:center}.hd td{border:1px solid #888}.sign td{border:0;text-align:center}.sign .sp{height:70px}.hd img{width:90px}</style>';
  var tmp=document.createElement('div');tmp.innerHTML=docHTML(m);
  tmp.querySelectorAll('details').forEach(function(d){d.setAttribute('open','')});
  return '<html><head><meta charset="utf-8">'+css+'</head><body>'+tmp.innerHTML.replace(/<summary>/g,'<h3>').replace(/<\/summary>/g,'</h3>')+'</body></html>';
}
function textDoc(m){
  var L=['BIÊN BẢN HỌP GIAO BAN HÀNG TUẦN','Ngày '+fmt(m.date)+' '+m.time+' - '+m.place,'','1. THÀNH PHẦN THAM DỰ'];
  m.attendees.forEach(function(a,i){L.push((i+1)+'. '+a.name+' - '+a.role)});
  L.push('','2. NỘI DUNG CUỘC HỌP');m.principles.forEach(function(s){L.push(plain(s))});
  function bl(items){items.forEach(function(p){L.push((p.k==='b'?new Array(p.l+1).join('  ')+'- ':p.k==='c'?'=> ':'')+plain(p.s))})}
  m.depts.forEach(function(d){L.push('',deptName(d.name).toUpperCase());bl(d.content);bl(d.notes)});
  L.push('','3. TỔNG HỢP GIAO VIỆC');bl(m.general);m.tasks.forEach(function(t){L.push(t.id+'. '+t.text+' | '+t.owner+' | '+t.dueText)});
  return L.join('\n');
}
$('t-viec').onclick=function(){tab='viec';sync();render()};
$('t-bb').onclick=function(){tab='bb';sync();render()};
$('b-word').onclick=function(){if(cur)save('BBH-'+cur.id+'.doc','application/msword',wordHTML(cur))};
$('b-csv').onclick=function(){if(!cur)return;var q=function(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'};
  var rows=[['STT','Nội dung','Phụ trách','Thời hạn','Hạn (ngày)']].concat(cur.tasks.map(function(t){return [t.id,t.text,t.owner,t.dueText,t.due||'']}));
  save('Viec-'+cur.id+'.csv','text/csv;charset=utf-8','﻿'+rows.map(function(r){return r.map(q).join(',')}).join('\r\n'))};
$('b-print').onclick=function(){tab='bb';sync();render();try{window.print()}catch(e){}};
$('b-copy').onclick=function(){if(!cur)return;var t=textDoc(cur);
  try{navigator.clipboard.writeText(t).then(function(){toast('Đã sao chép biên bản')},function(){toast('Trình duyệt không cho sao chép')})}catch(e){toast('Trình duyệt không cho sao chép')}};
var sel=$('mtg');
M.slice().reverse().forEach(function(m){var o=document.createElement('option');o.value=m.id;o.textContent=fmt(m.date)+' · '+m.title;sel.appendChild(o)});
sel.onchange=function(){cur=M.filter(function(m){return m.id===sel.value})[0];fStatus='all';fOwner='all';renderMeta();renderEdit();render()};
if(location.hash==='#bienban'){tab='bb'}
sync();renderMeta();renderEdit();render();
})();
</script>

</body>
</html>
